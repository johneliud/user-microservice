spring.application.name=user-microservice

spring.config.import=optional:classpath:application-secrets.properties

# Datasource values supplied via application-secrets.properties or environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.mfa-expiration=${JWT_MFA_EXPIRATION}

# TOTP
totp.issuer=${TOTP_ISSUER}

# Movie Service
movie.service.url=${MOVIE_SERVICE_URL}

# Cookie
cookie.secure=${COOKIE_SECURE}

# Server overridden by application-secrets.properties for local dev
server.port=${SERVER_PORT}